<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>IDHAM — تشخيص قيود المناديب</title>
<style>
  body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px;direction:rtl}
  h1{color:#38bdf8;font-size:1.3rem}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
  th{background:#1e293b;padding:8px 10px;text-align:right;color:#94a3b8}
  td{padding:7px 10px;border-bottom:1px solid #1e293b}
  .ok{color:#4ade80} .bad{color:#f87171} .warn{color:#facc15}
  .je-box{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;margin:6px 0;font-size:11px;font-family:monospace}
  button{background:#3b82f6;color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<h1>🔍 تشخيص قيود فواتير المناديب</h1>
<button onclick="diag()">🔄 فحص الآن</button>
<div id="out" style="margin-top:16px"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import{getFirestore,collection,doc,getDoc,getDocs,query,where}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const FB={apiKey:"AIzaSyAike2lPO7VnFoRHevnGkbHpAQbKoDb5r8",authDomain:"idham-foodstuffs-sa.firebaseapp.com",projectId:"idham-foodstuffs-sa",storageBucket:"idham-foodstuffs-sa.appspot.com",messagingSenderId:"271994882624",appId:"1:271994882624:web:ce8afd3e3c08fec01a2f1c"};
const app=initializeApp(FB,"diag");
const db=getFirestore(app);
const COID="idham-main";

// Revenue accounts we expect in income statement
const REV_ACCOUNTS=["4-1-1-1-1","4-1-1-1-2","4-1-1-1-3","4-1-1-2-1","4-1-1-2-2","4-1-2-1"];

window.diag=async()=>{
  const out=document.getElementById("out");
  out.innerHTML="<p style='color:#94a3b8'>جارٍ الفحص...</p>";
  let html="";

  // Get all rep invoices
  const allSnap=await getDocs(collection(db,`companies/${COID}/salesInvoices`));
  const repInvs=allSnap.docs.filter(d=>d.data().repId||d.data().salesRepId);
  
  html+=`<p style="color:#38bdf8">وجدنا ${repInvs.length} فاتورة للمناديب</p>`;
  html+=`<table><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>الإجمالي</th><th>الطريقة</th><th>المندوب</th><th>له قيد؟</th><th>حسابات القيد</th><th>يظهر في قائمة الدخل؟</th></tr>`;

  for(const id of repInvs){
    const inv={id:id.id,...id.data()};
    let jeHtml="لا قيد";
    let showsInIncome=false;
    
    if(inv.journalEntryId){
      try{
        const jeSnap=await getDoc(doc(db,`companies/${COID}/journalEntries`,inv.journalEntryId));
        if(jeSnap.exists()){
          const je=jeSnap.data();
          const lines=je.lines||[];
          jeHtml=`<div class="je-box">تاريخ القيد: ${je.date||"?"}<br>`;
          for(const l of lines){
            const isRev=REV_ACCOUNTS.includes(l.accountCode)||REV_ACCOUNTS.some(r=>l.accountId===r);
            if(isRev)showsInIncome=true;
            const cls=isRev?"ok":(l.accountCode?.startsWith("1-")||l.accountCode?.startsWith("2-"))?"":"warn";
            jeHtml+=`<span class="${cls}">${l.accountCode||l.accountId} | مدين:${(l.debit||0).toFixed(2)} | دائن:${(l.credit||0).toFixed(2)}</span><br>`;
          }
          jeHtml+="</div>";
        }else{
          jeHtml=`<span class="bad">القيد غير موجود! ID: ${inv.journalEntryId}</span>`;
        }
      }catch(e){jeHtml=`<span class="bad">خطأ: ${e.message}</span>`;}
    }

    const statusCls=showsInIncome?"ok":(inv.journalEntryId?"bad":"warn");
    const statusTxt=showsInIncome?"✅ نعم":(inv.journalEntryId?"❌ له قيد لكن لا يظهر":"⚠️ لا قيد");
    html+=`<tr>
      <td>${inv.invoiceNumber||inv.id}</td>
      <td>${inv.date||"?"}</td>
      <td>${(inv.total||0).toFixed(2)}</td>
      <td>${inv.paymentMethod||"?"}</td>
      <td>${inv.repName||inv.repId||"?"}</td>
      <td>${inv.journalEntryId?"✅ "+inv.journalEntryId.slice(0,12)+"...":"❌ لا"}</td>
      <td>${jeHtml}</td>
      <td class="${statusCls}">${statusTxt}</td>
    </tr>`;
  }
  html+="</table>";
  out.innerHTML=html;
};
</script>
</body>
</html>
